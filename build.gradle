plugins {
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.mymonkey.modpackexport'

base {
    archivesName = 'modpackexport'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

neoForge {
    version = '21.1.233'

    runs {
        client {
            client()
        }
    }

    mods {
        modpackexport {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // JEI API only (the full JEI jar is provided at runtime by the modpack).
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.27.0.340'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.27.0.340'
}

tasks.named('jar') {
    manifest {
        attributes([
            'Specification-Title'   : 'modpackexport',
            'Specification-Vendor'  : 'mymonkey',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'mymonkey'
        ])
    }
}
