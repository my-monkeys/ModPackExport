plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '5.1.+'
}

version = '1.0.0'
group = 'com.mymonkey.modpackexport'
archivesBaseName = 'modpackexport'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // Forge 1.18.2 uses official (Mojang) mappings.
    mappings channel: 'official', version: '1.18.2'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                modpackexport {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Matches the StoneBlock 3 instance loader (1.18.2-forge-40.2.34).
    minecraft 'net.minecraftforge:forge:1.18.2-40.2.34'
    // M1 needs no JEI — the recipe dump is RecipeManager-based. JEI is added with the
    // layout dump (M3).
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'modpackexport',
            'Specification-Vendor'  : 'mymonkey',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'mymonkey'
        ])
    }
}

// ForgeGradle 5 reobfuscates the jar back to SRG names for the runtime.
jar.finalizedBy('reobfJar')
